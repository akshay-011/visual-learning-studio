[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-learning-studio"
version = "1.0.0"
description = "Zero-cost autonomous educational video production studio and agent skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akshay", email = "engineer@omarchy.local" }
]
dependencies = [
    "pydantic>=2.5.0",
    "edge-tts>=7.0.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "pygments>=2.17.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vls = "scripts.studio:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
